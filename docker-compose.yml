# Local development database. Not used in stg/prod (Cloud SQL).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: proj_mana
      POSTGRES_PASSWORD: proj_mana
      POSTGRES_DB: proj_mana
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proj_mana -d proj_mana"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
