name: Deploy (stg)

# Deploys main to stg after CI has passed on it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: deploy-stg
  cancel-in-progress: false

jobs:
  deploy:
    # Repository variables (Settings > Secrets and variables > Actions > Variables),
    # values from `terraform output`. Skipped until stg has been set up.
    if: >-
      vars.STG_GCP_PROJECT_ID != '' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      REGION: asia-northeast1
      SERVICE: proj-mana
      MIGRATE_JOB: proj-mana-migrate
      IMAGE_REPO: asia-northeast1-docker.pkg.dev/${{ vars.STG_GCP_PROJECT_ID }}/proj-mana
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.STG_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STG_GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.IMAGE_REPO }}/app:${{ env.SHA }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.IMAGE_REPO }}/migrate:${{ env.SHA }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      # Migrations run before the new revision is deployed (CLAUDE.md §8).
      - name: Run database migrations
        run: |
          gcloud run jobs update "$MIGRATE_JOB" --region "$REGION" \
            --image "$IMAGE_REPO/migrate:$SHA"
          gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --region "$REGION" \
            --image "$IMAGE_REPO/app:$SHA" --quiet

      - name: Smoke test
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$url/api/health"
